  var btns = document.querySelectorAll('nav button');
  btns.forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === name); });
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(function (b) { b.addEventListener('click', function () { showTab(b.getAttribute('data-tab')); }); });
function renderInicio() {
  var pagos = ['pago', 'enviado', 'entregue'];
  var vendidos = pedidos.filter(function (p) { return pagos.indexOf(p.status) >= 0; });
  var receita = vendidos.reduce(function (s, p) { return s + (p.total || 0); }, 0);
  var custo = vendidos.reduce(function (s, p) { return s + (p.custoTotal || 0); }, 0);
  var lucro = receita - custo;
  var margem = receita > 0 ? Math.round((lucro / receita) * 100) : 0;
  var comPend = comissoes.filter(function (c) { return c.status === 'pendente'; });
  var comVal = comPend.reduce(function (s, c) { return s + (c.valor || 0); }, 0);
  var fatPend = faturas.filter(function (f) { return f.status === 'pendente'; });
  var fatVal = fatPend.reduce(function (s, f) { return s + (f.valor || 0); }, 0);
  var totalGasto = clientes.reduce(function (s, c) { return s + (c.totalGasto || 0); }, 0);
  var porProd = {};
  pedidos.forEach(function (p) { if (!porProd[p.produto]) porProd[p.produto] = { qtd: 0, rec: 0 }; porProd[p.produto].qtd += (p.quantidade || 1); porProd[p.produto].rec += (p.total || 0); });
  var top = Object.keys(porProd).map(function (k) { return { nome: k, qtd: porProd[k].qtd, rec: porProd[k].rec }; }).sort(function (a, b) { return b.rec - a.rec; }).slice(0, 3);
  var html = '';
  html += '<div class="kpis">';
  html += '<div class="kpi accent"><div class="dot"></div><div class="lbl">Receita</div><div class="val">' + brl(receita) + '</div><div class="sub">' + vendidos.length + ' venda(s) paga(s)</div></div>';
  html += '<div class="kpi"><div class="lbl">Lucro estimado</div><div class="val up">' + brl(lucro) + '</div><div class="sub">margem ' + margem + '%</div></div>';
  html += '<div class="kpi"><div class="lbl">Clientes</div><div class="val">' + clientes.length + '</div><div class="sub">' + brl(totalGasto) + ' acumulado</div></div>';
  html += '<div class="kpi"><div class="lbl">Pedidos</div><div class="val">' + pedidos.length + '</div><div class="sub">' + brl(custo) + ' em custos</div></div>';
  html += '<div class="kpi"><div class="lbl">Comissões pend.</div><div class="val" style="color:var(--warn)">' + brl(comVal) + '</div><div class="sub">' + comPend.length + ' registro(s)</div></div>';
  html += '<div class="kpi"><div class="lbl">Faturas pend.</div><div class="val" style="color:var(--info)">' + brl(fatVal) + '</div><div class="sub">' + fatPend.length + ' em aberto</div></div>';
  html += '</div>';
  html += '<div class="card"><h2>📈 Top produtos <span class="badge">por receita</span></h2>';
  if (top.length === 0) { html += '<div class="empty">Nenhuma venda ainda</div>'; }
  top.forEach(function (t) { html += '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><div class="grow"><div style="font-weight:600;font-size:13.5px">' + esc(t.nome) + '</div><div class="mut small">' + t.qtd + ' unidade(s)</div></div><div class="price">' + brl(t.rec) + '</div></div>'; });
  html += '</div>';
  html += '<div class="card"><h2>🧾 Últimos pedidos</h2>';
  if (pedidos.length === 0) { html += '<div class="empty">Nenhum pedido</div>'; }
  pedidos.slice().sort(function (a, b) { return String(b.data).localeCompare(String(a.data)); }).slice(0, 3).forEach(function (p) { html += '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><div style="font-weight:600;font-size:13.5px">' + esc(p.numero) + ' · ' + esc(p.produto) + '</div><div class="mut small">' + esc(p.cliente) + ' · ' + fmtData(p.data) + '</div></div><div style="text-align:right"><div class="price">' + brl(p.total) + '</div><div style="margin-top:3px">' + badge(p.status) + '</div></div></div>'; });
  html += '</div>';
  html += '<div class="card"><h2>🤝 Afiliados & comissões</h2>';
  html += '<div class="row"><div class="grow"><div style="font-weight:600">' + comissoes.length + ' comissão(ões)</div><div class="mut small">' + brl(comVal) + ' pendente(s) de pagamento</div></div><button class="btn ghost sm" onclick="showTab('afiliados')">Ver afiliados</button></div>';
  html += '</div>';
  document.getElementById('tab-inicio').innerHTML = html;
}
var buscaProd = ''; var nichoAtivo = 'todos';
function nichos() { var set = {}; PRODUTOS.forEach(function (p) { set[p.nicho] = true; }); return Object.keys(set).sort(); }
function renderProdutos() {
  var lista = PRODUTOS.filter(function (p) { var okBusca = !buscaProd || p.nome.toLowerCase().indexOf(buscaProd.toLowerCase()) >= 0 || p.descricao.toLowerCase().indexOf(buscaProd.toLowerCase()) >= 0; var okNicho = nichoAtivo === 'todos' || p.nicho === nichoAtivo; return okBusca && okNicho; });
  var html = '';
  html += '<h2>📦 Catálogo <span class="badge">' + PRODUTOS.length + ' produtos</span></h2>';
  html += '<div class="search"><span class="ic">🔍</span><input id="buscaProd" placeholder="Buscar produto…" value="' + esc(buscaProd) + '"></div>';
  html += '<div class="chips">';
  html += '<div class="chip' + (nichoAtivo === 'todos' ? ' on' : '') + '" onclick="setNicho('todos')">Todos</div>';
  nichos().forEach(function (n) { html += '<div class="chip' + (nichoAtivo === n ? ' on' : '') + '" onclick="setNicho('' + n + '')">' + esc(n) + '</div>'; });
  html += '</div>';
  if (lista.length === 0) { html += '<div class="empty">Nenhum produto encontrado</div>'; }
  lista.forEach(function (p) {
    html += '<div class="prod">';
    html += '<div class="top"><div><div class="nome">' + esc(p.nome) + '</div><div class="nicho">' + esc(p.nicho) + '</div></div><div class="margem">' + p.margem + '% margem</div></div>';
    html += '<div class="desc">' + esc(p.descricao) + '</div>';
    html += '<div class="meta"><div><div class="price">' + brl(p.precoBrl) + '</div><div class="mut small">custo ' + brl(p.custoBrl) + ' · lucro ' + brl(p.lucroBrl) + '</div></div><div class="forn">' + esc(p.fornecedores) + '</div></div>';
    html += '</div>';
  });
  document.getElementById('tab-produtos').innerHTML = html;
  var inp = document.getElementById('buscaProd');
  if (inp) inp.addEventListener('input', function () { buscaProd = inp.value; renderProdutos(); });
}
function setNicho(n) { nichoAtivo = n; renderProdutos(); }
function renderPedidos() {
  var html = '';
  html += '<h2>🧾 Pedidos <span class="badge">' + pedidos.length + '</span></h2>';
  html += '<button class="btn" onclick="abrirNovoPedido()">＋ Novo pedido</button>';
  html += '<div style="height:12px"></div>';
  if (pedidos.length === 0) { html += '<div class="empty">Nenhum pedido registrado</div>'; }
  pedidos.slice().sort(function (a, b) { return String(b.data).localeCompare(String(a.data)); }).forEach(function (p) {
    html += '<div class="pedido">';
    html += '<div class="top"><span class="num">' + esc(p.numero) + '</span>' + badge(p.status) + '</div>';
    html += '<div class="prod">' + esc(p.produto) + ' × ' + p.quantidade + '</div>';
    html += '<div class="det">' + esc(p.cliente) + ' · ' + fmtData(p.data) + (p.afiliado ? ' · afiliado: ' + esc(p.afiliado) : '') + '</div>';
    html += '<div class="foot"><div><div class="price">' + brl(p.total) + '</div><div class="mut small">custo ' + brl(p.custoTotal) + ' · lucro ' + brl(p.lucro) + '</div></div></div>';
    html += '<div class="statusbar">';
    ['novo', 'pago', 'enviado', 'entregue', 'cancelado'].forEach(function (s) { html += '<button class="btn sm ' + (p.status === s ? 'ghost' : '') + '" onclick="setStatus('' + p.id + '','' + s + '')">' + s + '</button>'; });
    html += '</div>';
    html += '</div>';
  });
  document.getElementById('tab-pedidos').innerHTML = html;
}
function setStatus(id, s) { var p = pedidos.find(function (x) { return x.id === id; }); if (!p) return; p.status = s; save('pedidos', pedidos); renderPedidos(); renderInicio(); toast('Pedido ' + p.numero + ' → ' + s); }
function abrirNovoPedido() {
  var opts = PRODUTOS.map(function (p) { return '<option value="' + esc(p.nome) + '">' + esc(p.nome) + ' — ' + brl(p.precoBrl) + '</option>'; }).join('');
  var html = '';
  html += '<span class="close" onclick="fecharModal()">×</span>';
  html += '<h3>Novo pedido</h3><div class="mut small">O preço é calculado do catálogo</div>';
  html += '<label>Produto</label><select id="npProd">' + opts + '</select>';
  html += '<label>Quantidade</label><input id="npQtd" type="number" value="1" min="1">';
  html += '<label>Cliente</label><input id="npCli" placeholder="Nome do cliente">';
  html += '<label>Email</label><input id="npEmail" type="email" placeholder="email@cliente.com">';
  html += '<label>Afiliado (opcional)</label><input id="npAfi" placeholder="afiliado_joao">';
  html += '<button class="btn" onclick="salvarPedido()">Registrar pedido</button>';
  abrirModal(html);
}
function salvarPedido() {
  var nome = document.getElementById('npProd').value;
  var qtd = parseInt(document.getElementById('npQtd').value, 10) || 1;
  var cli = document.getElementById('npCli').value.trim();
  var email = document.getElementById('npEmail').value.trim();
  var afi = document.getElementById('npAfi').value.trim();
  if (!cli) { toast('Informe o nome do cliente'); return; }
  var prod = PRODUTOS.find(function (p) { return p.nome === nome; });
  if (!prod) { toast('Produto inválido'); return; }
  var total = Math.round(prod.precoBrl * qtd * 100) / 100;
  var custo = Math.round(prod.custoBrl * qtd * 100) / 100;
  var ped = { id: 'p' + Date.now(), numero: 'PED-' + String(Date.now()).slice(-8), produto: nome, quantidade: qtd, precoUnitario: prod.precoBrl, total: total, custoTotal: custo, lucro: Math.round((total - custo) * 100) / 100, cliente: cli, email: email, afiliado: afi || null, status: 'novo', data: new Date().toISOString() };
  pedidos.unshift(ped); save('pedidos', pedidos); fecharModal(); renderPedidos(); renderInicio(); toast('Pedido ' + ped.numero + ' registrado');
}
function renderClientes() {
  var html = '';
  html += '<h2>👥 Clientes <span class="badge">' + clientes.length + '</span></h2>';
  html += '<button class="btn" onclick="abrirNovoCliente()">＋ Novo cliente</button>';
  html += '<div style="height:12px"></div>';
  if (clientes.length === 0) { html += '<div class="empty">Nenhum cliente cadastrado</div>'; }
  clientes.forEach(function (c) {
    var compras = pedidos.filter(function (p) { return (p.email || '').toLowerCase() === (c.email || '').toLowerCase() || (p.cliente || '').toLowerCase() === (c.nome || '').toLowerCase(); });
    html += '<div class="cliente">';
    html += '<div class="row"><div class="grow"><div class="nome">' + esc(c.nome) + '</div><div class="det">' + esc(c.email) + (c.telefone ? ' · ' + esc(c.telefone) : '') + '</div><div class="det">' + esc(c.cidade) + (c.origem ? ' · origem: ' + esc(c.origem) : '') + '</div></div>' + badge(c.status) + '</div>';
    html += '<div class="stats"><div><div class="mut small">Total gasto</div><b>' + brl(c.totalGasto) + '</b></div><div><div class="mut small">Pedidos</div><b>' + c.numPedidos + '</b></div><div><div class="mut small">Compras no app</div><b>' + compras.length + '</b></div></div>';
    html += '</div>';
  });
  document.getElementById('tab-clientes').innerHTML = html;
}
function abrirNovoCliente() {
  var html = '';
  html += '<span class="close" onclick="fecharModal()">×</span>';
  html += '<h3>Novo cliente</h3>';
  html += '<label>Nome *</label><input id="ncNome" placeholder="Nome completo">';
  html += '<label>Email *</label><input id="ncEmail" type="email" placeholder="email@cliente.com">';
  html += '<label>Telefone / WhatsApp</label><input id="ncTel" placeholder="(11) 99999-9999">';
  html += '<label>Cidade / UF</label><input id="ncCid" placeholder="São Paulo - SP">';
  html += '<label>Origem do lead</label><input id="ncOri" placeholder="Instagram, afiliado, site…">';
  html += '<button class="btn" onclick="salvarCliente()">Cadastrar cliente</button>';
  abrirModal(html);
}
function salvarCliente() {
  var nome = document.getElementById('ncNome').value.trim();
  var email = document.getElementById('ncEmail').value.trim().toLowerCase();
  if (!nome || !email) { toast('Nome e email são obrigatórios'); return; }
  var dup = clientes.find(function (c) { return c.email === email; });
  if (dup) { toast('Cliente já cadastrado'); fecharModal(); return; }
  var cli = { id: 'c' + Date.now(), nome: nome, email: email, telefone: document.getElementById('ncTel').value.trim(), cidade: document.getElementById('ncCid').value.trim(), origem: document.getElementById('ncOri').value.trim(), status: 'ativo', totalGasto: 0, numPedidos: 0, dataCadastro: new Date().toISOString() };
  clientes.push(cli); save('clientes', clientes); fecharModal(); renderClientes(); renderInicio(); toast('Cliente ' + nome + ' cadastrado');
}
function renderFaturas() {
  var html = '';
  html += '<h2>💳 Faturas <span class="badge">' + faturas.length + '</span></h2>';
  if (faturas.length === 0) { html += '<div class="empty">Nenhuma fatura</div>'; }
  faturas.forEach(function (f) {
    html += '<div class="fatura">';
    html += '<div class="top"><span class="num">' + esc(f.numero) + '</span>' + badge(f.status) + '</div>';
    html += '<div class="det">Pedido ' + esc(f.pedido) + ' · ' + esc(f.cliente) + '</div>';
    html += '<div class="det">Vencimento ' + fmtData(f.vencimento) + ' · ' + esc(f.forma) + '</div>';
    html += '<div class="val">' + brl(f.valor) + '</div>';
    html += '</div>';
  });
  document.getElementById('tab-faturas').innerHTML = html;
}
function renderAfiliados() {
  var grupos = {};
  comissoes.forEach(function (c) { if (!grupos[c.afiliado]) grupos[c.afiliado] = { total: 0, pend: 0, n: 0 }; grupos[c.afiliado].total += (c.valor || 0); if (c.status === 'pendente') grupos[c.afiliado].pend += (c.valor || 0); grupos[c.afiliado].n += 1; });
  var html = '';
  html += '<h2>🤝 Afiliados & comissões</h2>';
  html += '<button class="btn ghost" onclick="showTab('inicio')">← Voltar ao início</button>';
  html += '<div style="height:12px"></div>';
  var chaves = Object.keys(grupos);
  if (chaves.length === 0) { html += '<div class="empty">Nenhuma comissão registrada</div>'; }
  chaves.forEach(function (a) {
    var g = grupos[a];
    html += '<div class="afiliado">';
    html += '<div class="nome">' + esc(a) + '</div>';
    html += '<div class="det">' + g.n + ' comissão(ões) registrada(s)</div>';
    html += '<div class="val">' + brl(g.pend) + ' pendente</div>';
    html += '<div class="mut small">total gerado: ' + brl(g.total) + '</div>';
    html += '</div>';
  });
  html += '<div class="card"><h2>Detalhe das comissões</h2>';
  comissoes.forEach(function (c) { html += '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><div class="grow"><div style="font-weight:600;font-size:13px">' + esc(c.pedido) + ' · ' + esc(c.produto) + '</div><div class="mut small">' + esc(c.afiliado) + ' · ' + c.percentual + '% · ' + fmtData(c.data) + '</div></div><div style="text-align:right"><div class="price">' + brl(c.valor) + '</div><div style="margin-top:2px">' + badge(c.status) + '</div></div></div>'; });
  html += '</div>';
  document.getElementById('tab-afiliados').innerHTML = html;
}
function abrirModal(html) { document.getElementById('modalBody').innerHTML = html; document.getElementById('modal').classList.add('open'); }
function fecharModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', function (e) { if (e.target === this) fecharModal(); });
renderInicio(); renderProdutos(); renderPedidos(); renderClientes(); renderFaturas(); renderAfiliados();
</script>
